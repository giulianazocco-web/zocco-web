# Panel de edición de zocco.ar (Pages CMS · app.pagescms.org)
media:
  input: assets/img/ctrlg
  output: /assets/img/ctrlg
content:
  - name: ctrlg
    label: CTRL.G
    type: collection
    path: ctrlg/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: date
        label: Fecha
        type: date
        required: true
      - name: description
        label: Bajada (una línea, la que aparece en Google y en el listado)
        type: text
      - name: image
        label: Imagen (opcional)
        type: image
      - name: body
        label: Texto
        type: rich-text
